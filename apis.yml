aid: vention
name: Vention
description: >-
  Vention is a Montreal-based manufacturing automation company offering an
  integrated hardware, software, and AI platform for factory automation. Its
  Manufacturing Automation Platform spans MachineBuilder (browser CAD for
  designing automated equipment), MachineLogic (no-code, AI Copilot, and Python
  programming plus digital-twin simulation), MachineMotion AI (an automation
  controller with a built-in NVIDIA Jetson GPU that drives robots, motors, and
  sensors), and MachineAnalytics (remote monitoring). Developers program and
  control MachineMotion hardware through the official Vention Python SDK
  (machine-logic-sdk, imported as `from MachineMotion import *`), which exposes
  motion control, digital I/O, robot coordination, and path execution. Vention
  reports 28,000+ machines running globally and use by 90 of the Fortune 500.
